[workspace]
authors = ["Ameyanagi <contact@ameyanagi.com>"]
channels = ["https://conda.modular.com/max", "conda-forge"]
name = "kagerou"
platforms = ["osx-arm64", "linux-64", "linux-aarch64"]
version = "0.1.0"

[tasks]
bench-coverage = { cmd = "mojo run -O3 -I src benchmarks/bench_coverage.mojo", description = "Measure regular-grid coverage quality and cost" }
example-coverage = { cmd = "mojo run -O3 -I src examples/coverage_gallery.mojo", description = "Print a self-contained SVG comparing coverage quality" }
bench-surface = { cmd = "mojo run -O3 -I src benchmarks/bench_surface.mojo", description = "Benchmark p50/p95 surface compositing and path rasterization" }
build-profile-path = { cmd = "mojo build -O3 -I src benchmarks/profile_path.mojo -o .pixi/profile_path", description = "Build the long-running path-raster sampling workload" }
build-profile-surface = { cmd = "mojo build -O3 -I src benchmarks/profile_surface.mojo -o .pixi/profile_surface", description = "Build the long-running rectangle-composite sampling workload" }
check = { depends-on = ["format-check", "readme-check", "test", "precompile"], description = "Run the complete validation suite" }
example = { cmd = "mojo run -I src examples/basic.mojo", description = "Run the structural smoke example" }
example-raster = { cmd = "mojo run -I src examples/raster_fill.mojo", description = "Run the clipped path-raster example" }
format = { cmd = "bash scripts/format.sh", description = "Format Mojo source files" }
format-check = { cmd = "bash scripts/check-format.sh", description = "Verify Mojo formatting without modifying source" }
package = { cmd = "rattler-build build --recipe conda.recipe/recipe.yaml -c conda-forge -c https://conda.modular.com/max -c https://repo.prefix.dev/modular-community", description = "Build the local Conda package" }
precompile = { cmd = "mojo precompile --Werror --warn-on-unstable-apis src/kagerou -o .pixi/kagerou.mojoc", description = "Precompile the package with warnings as errors" }
readme-check = { cmd = "bash scripts/check-readme.sh", description = "Compile the README's fenced Mojo blocks exactly as pasted" }
test = { cmd = "bash scripts/test.sh", description = "Run all Mojo TestSuite files" }

[dependencies]
mojo = "==1.0.0"
rattler-build = ">=0.74,<0.75"
