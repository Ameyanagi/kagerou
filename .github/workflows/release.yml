name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  verify:
    name: Verify release contract
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - name: Match tag, versions, compiler, and changelog
        run: |
          set -euo pipefail
          workspace_version="$(sed -n 's/^version = "\([^"]*\)"$/\1/p' pixi.toml)"
          recipe_version="$(sed -n 's/^  version: "\([^"]*\)"$/\1/p' conda.recipe/recipe.yaml)"
          [[ "$workspace_version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          [[ "$recipe_version" == "$workspace_version" ]]
          [[ "$GITHUB_REF" == "refs/tags/v${workspace_version}" ]]
          [[ "$(git cat-file -t "$GITHUB_REF")" == "tag" ]]
          [[ "$(git rev-parse "${GITHUB_REF}^{commit}")" == "$GITHUB_SHA" ]]
          git merge-base --is-ancestor "$GITHUB_SHA" refs/remotes/origin/main
          [[ "$(sed -n 's/^mojo = "\([^"]*\)"$/\1/p' pixi.toml)" == "==1.0.0" ]]
          [[ "$(grep -c '^    - mojo-compiler ==1\.0\.0$' conda.recipe/recipe.yaml)" -eq 3 ]]
          [[ "$(grep -c '^    - mojo-compiler ' conda.recipe/recipe.yaml)" -eq 3 ]]
          for section in build host run; do
            awk -v wanted="$section" '
              $0 == "requirements:" { in_requirements = 1; next }
              in_requirements && /^[^ ]/ { in_requirements = 0 }
              in_requirements && /^  [[:alnum:]_-]+:$/ {
                current = $1
                sub(/:$/, "", current)
              }
              in_requirements && current == wanted && /^    - mojo-compiler / {
                total += 1
                if ($0 == "    - mojo-compiler ==1.0.0") exact += 1
              }
              END { exit !(total == 1 && exact == 1) }
            ' conda.recipe/recipe.yaml
          done
          grep -Fq "## [${workspace_version}] - " CHANGELOG.md

  check:
    name: Check ${{ matrix.name }}
    needs: verify
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux x86-64
            os: ubuntu-24.04
          - name: Linux ARM64
            os: ubuntu-24.04-arm
          - name: macOS ARM64
            os: macos-14
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: prefix-dev/setup-pixi@d3f436a425481402e6a95a1d1fc10331c708cd9e # v0.10.2
        with:
          pixi-version: v0.76.2
          cache: true
      - name: Check source and installed package
        run: |
          set -euo pipefail
          pixi run --locked check
          pixi run --locked package
          bash scripts/check-package-metadata.sh

  publish:
    name: Publish source release
    needs: check
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Build source archive
        run: >-
          git archive --format=tar.gz
          --prefix="kagerou-${GITHUB_REF_NAME}/"
          --output="kagerou-${GITHUB_REF_NAME}.tar.gz"
          "${GITHUB_SHA}"
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh release create "${GITHUB_REF_NAME}"
          "kagerou-${GITHUB_REF_NAME}.tar.gz"
          --verify-tag --generate-notes
          --title "Kagerou ${GITHUB_REF_NAME}"
